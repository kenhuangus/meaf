[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meaf"
version = "2.0.0"
description = "MAESTRO Executable Assurance Framework: a machine-verifiable assurance layer over the MAESTRO agentic-AI threat taxonomy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
    "security",
    "assurance",
    "agentic-ai",
    "maestro",
    "oscal",
    "threat-modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
meaf = "meaf.__main__:main"

[tool.setuptools]
# schema/, policies/ and testpacks/ hold data, not code, so they carry no
# __init__.py and ship as package data rather than as subpackages.
packages = ["meaf"]

[tool.setuptools.package-data]
meaf = [
    "schema/*.json",
    "policies/*.json",
    "testpacks/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["meaf"]
omit = ["meaf/examples/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
